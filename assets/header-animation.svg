<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a120e">
        <animate attributeName="stop-color" values="#0a120e;#0f1f17;#132e20;#0a120e" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#111c15">
        <animate attributeName="stop-color" values="#111c15;#182e22;#1f3b2c;#111c15" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#080e0a">
        <animate attributeName="stop-color" values="#080e0a;#0b1710;#0e2117;#080e0a" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2">
        <animate attributeName="stop-color" values="#34d399;#10b981;#6ee7b7;#34d399" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="particleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(1.3) translate(30px, -10px); opacity: 0.6; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
    }
    @keyframes shimmerText {
      0% { fill: #ffffff; }
      50% { fill: #6ee7b7; }
      100% { fill: #ffffff; }
    }
    @keyframes floatIcon {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }
    .orb-1 { animation: pulseOrb 6s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb 8s ease-in-out infinite reverse; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.5px;
      animation: shimmerText 5s ease-in-out infinite;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      fill: #34d399;
    }
    .icon-float { animation: floatIcon 3s ease-in-out infinite; }
  </style>

  <!-- Background Box -->
  <rect x="2" y="2" width="896" height="156" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background Orbs -->
  <circle class="orb-1" cx="120" cy="80" r="90" fill="url(#particleGlow)" />
  <circle class="orb-2" cx="780" cy="70" r="110" fill="url(#particleGlow)" />

  <!-- Grid Dots pattern -->
  <g opacity="0.08" fill="#ffffff">
    <circle cx="50" cy="30" r="1.5"/><circle cx="80" cy="30" r="1.5"/><circle cx="110" cy="30" r="1.5"/><circle cx="140" cy="30" r="1.5"/>
    <circle cx="50" cy="60" r="1.5"/><circle cx="80" cy="60" r="1.5"/><circle cx="110" cy="60" r="1.5"/><circle cx="140" cy="60" r="1.5"/>
    <circle cx="50" cy="90" r="1.5"/><circle cx="80" cy="90" r="1.5"/><circle cx="110" cy="90" r="1.5"/><circle cx="140" cy="90" r="1.5"/>
    <circle cx="50" cy="120" r="1.5"/><circle cx="80" cy="120" r="1.5"/><circle cx="110" cy="120" r="1.5"/><circle cx="140" cy="120" r="1.5"/>
    <circle cx="760" cy="30" r="1.5"/><circle cx="790" cy="30" r="1.5"/><circle cx="820" cy="30" r="1.5"/><circle cx="850" cy="30" r="1.5"/>
    <circle cx="760" cy="60" r="1.5"/><circle cx="790" cy="60" r="1.5"/><circle cx="820" cy="60" r="1.5"/><circle cx="850" cy="60" r="1.5"/>
    <circle cx="760" cy="90" r="1.5"/><circle cx="790" cy="90" r="1.5"/><circle cx="820" cy="90" r="1.5"/><circle cx="850" cy="90" r="1.5"/>
    <circle cx="760" cy="120" r="1.5"/><circle cx="790" cy="120" r="1.5"/><circle cx="820" cy="120" r="1.5"/><circle cx="850" cy="120" r="1.5"/>
  </g>

  <!-- Left Icon / Logo Symbol -->
  <g class="icon-float" transform="translate(48, 48)">
    <rect x="0" y="0" width="64" height="64" rx="18" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-width="1.5" />
    <!-- Modern Shopping Bag Icon -->
    <path d="M22 24 C22 17.37 26.48 12 32 12 C37.52 12 42 17.37 42 24" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <rect x="16" y="24" width="32" height="28" rx="6" fill="none" stroke="#34d399" stroke-width="3" />
    <circle cx="32" cy="36" r="3" fill="#6ee7b7" />
  </g>

  <!-- Main Content Center -->
  <g transform="translate(136, 42)">
    <!-- Pill Status Badge -->
    <rect x="0" y="0" width="180" height="22" rx="11" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="10" cy="11" r="3.5" fill="#34d399">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="22" y="15" class="badge-text">PRODUCTION READY v2.0</text>

    <!-- Main Title -->
    <text x="0" y="54" class="title-text" filter="url(#glow)">ShopMate™ Enterprise</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="82" class="subtitle-text">
      Next-Gen E-Commerce • Interactive 3D WebGL Viewer • 2FA SMTP Security • Supabase Cloud
    </text>
  </g>

  <!-- Right Side Interactive Stats -->
  <g transform="translate(735, 48)">
    <rect x="0" y="0" width="115" height="64" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <text x="57" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#94a3b8">LATENCY</text>
    <text x="57" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" font-weight="800" fill="#34d399">&lt; 120ms</text>
  </g>
</svg>
